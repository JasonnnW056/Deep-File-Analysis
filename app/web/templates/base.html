<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Deep File Analysis{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('web.index') }}">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 3h7l4 4v14h-11z"/><path d="M13.5 3v4h4"/><path d="M9 13h6"/><path d="M9 16.5h4"/>
        </svg>
      </span>
      <span class="brand-name">Deep File Analysis</span>
    </a>
    <span class="tagline">Static analysis &middot; files are never executed</span>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">A clean result does not prove a file is safe. This tool reads files; it never runs them.</footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
