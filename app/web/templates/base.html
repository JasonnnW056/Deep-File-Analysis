<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Deep File Analysis{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('web.index') }}">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 3h7l4 4v14h-11z"/><path d="M13.5 3v4h4"/><path d="M9 13h6"/><path d="M9 16.5h4"/>
        </svg>
      </span>
      <span class="brand-name">Deep File Analysis</span>
    </a>
    <nav class="topnav">
      <span class="tagline">Fast scan is static only &middot; Hybrid runs files in a sandbox</span>
      <a class="navlink" href="{{ url_for('web.history') }}">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        History
      </a>
    </nav>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">A clean result does not prove a file is safe. Fast scans only read files; Hybrid scans execute them in an isolated sandbox.</footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
